<style>
/* Layout: app shell. Brand-navy sidebar of four tools (Reception, Jobs, Hub, Insights) beside a light working canvas. Brand: Werkbank navy #003883, diamond blue #004baa, green #00bf63. */
:root{
  --bg:#eef2f8; --surface:#ffffff; --sunk:#e3e9f3; --ink:#0d1f3c; --muted:#52617a; --line:#d2dbe8;
  --navy:#003883; --on-navy:#ffffff; --navy-soft:#dde7f6; --brass:#00bf63; --brass-soft:#d4f5e3; --accent-ink:#00733b;
  --chart-a:#003883; --chart-b:#00bf63;
  --side-bg:#003883; --side-ink:#ffffff; --side-muted:#a9bfe3; --side-line:#1a4f9c; --side-hover:#004baa; --side-cur:#00bf63; --side-cur-ink:#00285f;
  --good:#1f7a4a; --good-soft:#dcefe3; --warn:#b45309; --warn-soft:#fbe8d3; --bad:#b42318; --bad-soft:#f8dcd9;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#04193a; --surface:#0a2550; --sunk:#03142f; --ink:#e6eefb; --muted:#9db0d0; --line:#1b3d70;
  --navy:#00bf63; --on-navy:#00285f; --navy-soft:#0d3a6e; --brass:#00bf63; --brass-soft:#0b3a3a; --accent-ink:#45dd92;
  --chart-a:#5b93e8; --chart-b:#00bf63;
  --side-bg:#00285f; --side-ink:#ffffff; --side-muted:#9db4dc; --side-line:#123f80; --side-hover:#003883; --side-cur:#00bf63; --side-cur-ink:#00285f;
  --good:#45dd92; --good-soft:#0f3a2c; --warn:#f0a14a; --warn-soft:#3a2711; --bad:#f07167; --bad-soft:#3d1a18; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#04193a; --surface:#0a2550; --sunk:#03142f; --ink:#e6eefb; --muted:#9db0d0; --line:#1b3d70;
  --navy:#00bf63; --on-navy:#00285f; --navy-soft:#0d3a6e; --brass:#00bf63; --brass-soft:#0b3a3a; --accent-ink:#45dd92;
  --chart-a:#5b93e8; --chart-b:#00bf63;
  --side-bg:#00285f; --side-ink:#ffffff; --side-muted:#9db4dc; --side-line:#123f80; --side-hover:#003883; --side-cur:#00bf63; --side-cur-ink:#00285f;
  --good:#45dd92; --good-soft:#0f3a2c; --warn:#f0a14a; --warn-soft:#3a2711; --bad:#f07167; --bad-soft:#3d1a18; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
/* sidebar */
.side{background:var(--side-bg);color:var(--side-ink);border-right:1px solid var(--side-line);padding:20px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{flex:none;width:44px;height:44px;border-radius:8px;box-shadow:0 0 0 1px var(--side-line)}
.brand b{font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:21px;letter-spacing:-.01em;color:var(--side-cur);line-height:1}
.brand small{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.22em;color:var(--side-ink);margin-top:3px}
.biz{padding:10px;border:1px solid var(--side-line);border-radius:var(--r);background:color-mix(in srgb,var(--side-bg) 70%,#000)}
.biz .n{font-weight:600}
.biz .m{color:var(--side-muted);font-size:12px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 10px;border-radius:var(--r);color:var(--side-ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--side-hover)}
nav a[aria-current="page"]{background:var(--side-cur);color:var(--side-cur-ink);font-weight:600}
nav a .tag{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.75}
nav a .lock{font-size:11px}
.tier{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.lbl{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--side-line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:transparent;color:var(--side-ink);padding:8px 6px;text-align:left;line-height:1.2}
.seg button small{display:block;color:var(--side-muted);font-family:var(--f-mono);font-size:11px}
.seg button[aria-pressed="true"]{background:var(--side-cur);color:var(--side-cur-ink)}
.seg button[aria-pressed="true"] small{color:var(--side-cur-ink)}
.note{font-size:12px;color:var(--muted)}
.side .note,.side .lbl{color:var(--side-muted)}
/* main */
main{min-width:0;padding-block:24px 48px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-family:var(--f-display);font-stretch:88%;font-weight:750;font-size:30px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.demo{background:var(--brass-soft);color:var(--accent-ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.navy{background:var(--navy-soft);color:var(--navy)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.ph h2{font-family:var(--f-display);font-stretch:92%;font-size:16px;font-weight:700;margin:0}
.pb{padding:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-weight:500}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.btn.primary:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:13px}
.grid2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
/* reception */
.caller{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid var(--line)}
.ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--navy-soft);color:var(--navy);flex:none}
.live .ring{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--navy) 45%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.caller .who{flex:1;min-width:0}
.caller .who b{display:block}
.caller .who span{color:var(--muted);font-size:13px}
.transcript{padding:16px;display:flex;flex-direction:column;gap:12px;min-height:340px;max-height:460px;overflow-y:auto;background:var(--bg)}
.msg{max-width:86%;padding:9px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);animation:in .25s ease-out}
.msg.ai{align-self:flex-start;border-left:3px solid var(--navy)}
.msg.cust{align-self:flex-end}
.msg .who{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.msg .de{display:block}
.msg .en{display:block;color:var(--muted);font-size:12.5px;font-style:italic}
@keyframes in{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
.empty{color:var(--muted);text-align:center;margin:auto;max-width:36ch}
.fields{display:flex;flex-direction:column}
.field{display:grid;grid-template-columns:118px 1fr;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:baseline}
.field:last-child{border-bottom:0}
.field dt{color:var(--muted);font-size:13px}
.field dd{margin:0;font-weight:500;min-width:0}
.field dd.wait{color:var(--muted);font-weight:400}
.field.just dd{animation:flash 1.2s ease-out}
@keyframes flash{0%{background:var(--brass-soft)}100%{background:transparent}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line)}
.stats div{background:var(--surface);padding:12px 16px}
.stats b{font-family:var(--f-display);font-size:22px;font-weight:700;display:block}
.stats span{font-size:12px;color:var(--muted)}
/* jobs */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
.board{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.colh{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px}
.colh b{font-family:var(--f-display);font-stretch:90%;font-size:14px}
.colh span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:flex;flex-direction:column;gap:6px}
.card.new-flash{animation:flash 2s ease-out;border-color:var(--brass)}
.card .t{font-weight:600;line-height:1.3}
.card .c{color:var(--muted);font-size:13px}
.card .row{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.src{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy)}
.colempty{border:1px dashed var(--line);border-radius:var(--r);padding:14px;color:var(--muted);font-size:13px;text-align:center}
/* hub */
.hub{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.clist{display:flex;flex-direction:column}
.clist button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:11px 16px;display:flex;flex-direction:column;gap:1px}
.clist button:last-child{border-bottom:0}
.clist button:hover{background:var(--sunk)}
.clist button[aria-current="true"]{background:var(--navy-soft)}
.clist small{color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:92px 22px 1fr auto;gap:10px;align-items:start;padding:10px 0}
.timeline .d{color:var(--muted);font-size:12.5px;font-family:var(--f-mono);padding-top:2px}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;border:2px solid var(--navy);background:var(--surface);justify-self:center;position:relative}
.timeline li:not(:last-child) .dot::after{content:"";position:absolute;left:50%;top:12px;width:2px;height:44px;background:var(--line);transform:translateX(-50%)}
.timeline .k{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.timeline .x{font-weight:500}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.drop.over{border-color:var(--navy);background:var(--navy-soft)}
.thumb{width:84px;height:104px;border-radius:4px;background:var(--sunk);border:1px solid var(--line);object-fit:cover;flex:none}
.ocr{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px;margin:0}
.ocr dt{color:var(--muted)}
.ocr dd{margin:0;font-weight:500}
/* insights */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-stretch:90%;font-weight:750;font-size:28px;line-height:1.1;margin:4px 0}
.kpi .d{font-size:12.5px}
.up-bad{color:var(--bad)} .up-good{color:var(--good)}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.advice{display:flex;flex-direction:column}
.adv{display:grid;grid-template-columns:4px 1fr;border-bottom:1px solid var(--line)}
.adv:last-child{border-bottom:0}
.adv .s{background:var(--warn)}
.adv.bad .s{background:var(--bad)} .adv.info .s{background:var(--navy)} .adv.done .s{background:var(--good)}
.adv .b{padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.adv h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.adv p{margin:0;color:var(--muted);font-size:13.5px;max-width:68ch}
.adv .a{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.ask{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.ask input{flex:1;min-width:0;border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;background:var(--bg);color:var(--ink);font:inherit}
.answer{padding:0 16px 14px;color:var(--ink);font-size:13.5px}
.answer:empty{display:none}
/* locked */
.locked{max-width:560px;margin:40px auto;text-align:center;padding:32px}
.locked h2{font-family:var(--f-display);font-stretch:90%;font-size:22px;margin:10px 0 6px}
.locked p{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-right:0;border-bottom:1px solid var(--side-line)}
  .biz{display:none}
  nav{flex-direction:row;overflow-x:auto;width:100%;order:3}
  nav a{white-space:nowrap}
  nav a .tag{display:none}
  .tier{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .tier .lbl,.tier .note{display:none}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .hub{grid-template-columns:1fr}
  .field{grid-template-columns:96px 1fr}
  .timeline li{grid-template-columns:76px 18px 1fr;}
  .timeline li .amt{grid-column:3}
}
@media (max-width:480px){.kpis{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.brand b{font-size:19px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function playCall(){
  const c=state.call;c.status='live';c.step=0;c.fields={};render();

function answer(q){
  q=q.toLowerCase();
  if(/worth|best|biggest|most/.test(q))return 'By revenue this year: Hausverwaltung Isar (€6,900), Familie Schneider (€4,040 incl. the open quote) and Bäckerei Wimmer (€3,150). Isar is the biggest, but also the slowest payer.';
  if(/late|overdue|owe|pay/.test(q))return 'Three invoices are overdue, €4,200 in total. The oldest is Hausverwaltung Isar, 38 days past due.';
  if(/material|cost|supplier|price/.test(q))return 'Material costs rose 18% quarter on quarter, mostly cable and breakers from Sonepar. Your quote template still uses spring prices.';
  if(/call|phone|reception/.test(q))return 'The receptionist answered 23 calls this month while the team was busy. 9 became booked jobs worth €7,850 in quotes.';
  return 'In this prototype, try asking about overdue invoices, material costs, calls, or which customer is worth the most.';
}
function chart(){
  const W=520,H=250,L=36,R=10,T=10,B=28,max=50,ih=H-T-B,iw=W-L-R,g=iw/months.length,bw=g*0.38;
  const y=v=>T+ih-(v/max)*ih;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly revenue and material costs, June to November 2026">`;
  for(let v=0;v<=max;v+=10)s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`;
  months.forEach((mo,i)=>{const cx=L+g*i+g/2;
    s+=`<rect x="${cx-bw-1}" y="${y(rev[i])}" width="${bw}" height="${y(0)-y(rev[i])}" rx="2" fill="var(--chart-a)"><title>${mo}: revenue €${rev[i]}k</title></rect>`;
    s+=`<rect x="${cx+1}" y="${y(mat[i])}" width="${bw}" height="${y(0)-y(mat[i])}" rx="2" fill="var(--chart-b)"><title>${mo}: material €${mat[i]}k</title></rect>`;
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle" font-size="11.5" fill="var(--muted)">${mo}</text>`;});
  s+=`<line x1="${L+g*3}" x2="${L+g*3}" y1="${T}" y2="${y(0)}" stroke="var(--muted)" stroke-dasharray="3 3" stroke-width="1"/><text x="${L+g*3+5}" y="${T+10}" font-size="10.5" fill="var(--muted)">this quarter</text>`;
  return s+'</svg>';
}

route();
</script>
